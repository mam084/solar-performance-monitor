# Daily pipeline run. A template: copy it to .github/workflows/daily-pipeline.yml to turn it on.
#
# What it does, per site: download any new raw files -> preflight -> pipeline build ->
# commit data/processed/ (the Streamlit app redeploys from that commit) -> optionally
# load Snowflake. GitHub runners can reach NREL's public S3 bucket, so no AWS account is needed.
#
# Before enabling:
#   1. Settings -> Actions -> General -> Workflow permissions: "Read and write" (to commit results)
#   2. Optional secrets (Settings -> Secrets and variables -> Actions):
#        ANTHROPIC_API_KEY                          -> tickets drafted by Claude instead of the template
#        SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD -> also load the warehouse
#   3. Set SITES below to the sites that have real column mappings in config/sites.yaml.
#
# Note: PVDAQ is an archive, so a daily run mostly re-confirms history. In production the
# download step would read the operator's SCADA/monitoring feed; everything after it is the same.

name: daily-pipeline

on:
  schedule:
    - cron: "17 14 * * *"   # 06:17 Pacific (PST), after sites' overnight data uploads
  workflow_dispatch:
    inputs:
      sites:
        description: "Space-separated system ids"
        default: "2107"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  SITES: ${{ github.event.inputs.sites || '2107' }}
  # At workflow level so the Snowflake step's `if:` can see whether it's configured
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ env.SITES }}-${{ github.run_id }}
          restore-keys: raw-${{ env.SITES }}-

      - name: Download new raw files
        run: |
          for id in $SITES; do
            python -m solarmon.ingest download "$id" --include meter irradiance environment
          done

      - name: Preflight
        run: |
          for id in $SITES; do
            python -m solarmon.preflight "$id" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flag=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then flag="--claude"; fi
          for id in $SITES; do
            python -m solarmon.pipeline build "$id" $flag | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Tests
        run: pytest -q

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No changes in data/processed"
          else
            git commit -m "Daily pipeline run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Load Snowflake
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          pip install "snowflake-connector-python[pandas]"
          for id in $SITES; do python -m solarmon.warehouse push "$id"; done
