[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarmon"
version = "0.3.0"
description = "Solar performance monitor: expected vs actual PV output, underperformance detection, and agent-drafted maintenance tickets."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "pyarrow",
    "pvlib>=0.11",
    "boto3",
    "pyyaml",
    "matplotlib",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
warehouse = ["snowflake-connector-python[pandas]>=3.0"]
app = ["streamlit>=1.40", "plotly>=5.20", "anthropic>=0.40"]
dev = ["pytest", "jupyter", "streamlit>=1.40", "plotly>=5.20", "anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
