[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarmon"
version = "0.1.0"
description = "Solar performance monitor: expected vs actual PV output, underperformance detection, and agent-drafted maintenance tickets."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "pyarrow",
    "pvlib>=0.11",
    "boto3",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
