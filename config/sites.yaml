# Starter fleet for the solar performance monitor.
# Metadata comes from NREL's PVDAQ systems index (systems_20250729.csv).
#
# source:
#   prize -> 2023 DOE Solar Data Prize site (CSV files under pvdaq/2023-solar-data-prize/<id>_OEDI/data/)
#   basic -> standard PVDAQ site (daily files under pvdaq/<fmt>/pvdata/system_id=<id>/year=/month=/day=/)
#
# columns: maps our canonical names to the raw column names in that site's files.
# Leave as null until you've run `python -m solarmon.inspect <id>` and picked the right sensors.

sites:
  2107:
    name: Farm Solar Array
    location: Arbuckle, CA
    source: prize
    latitude: 38.996306
    longitude: -122.134111
    elevation_m: 10
    timezone: America/Los_Angeles
    dc_capacity_kw: 893
    mount: fixed
    tilt: 25
    azimuth: 180
    years_available: [2017, 2024]
    columns:
      ac_power: null
      poa_irradiance: null
      module_temp: null
      ambient_temp: null
      wind_speed: null

