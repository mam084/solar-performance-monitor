# Starter fleet for the solar performance monitor.
# Metadata comes from NREL's PVDAQ systems index (systems_20250729.csv).
#
# source:
#   prize -> 2023 DOE Solar Data Prize site (CSV files under pvdaq/2023-solar-data-prize/<id>_OEDI/data/)
#   basic -> standard PVDAQ site (daily files under pvdaq/<fmt>/pvdata/system_id=<id>/year=/month=/day=/)
#
# columns: maps our canonical names to the raw column names in that site's files.
# Leave as null until you've run `python -m solarmon.inspect <id>` and picked the right sensors.
#
# units (optional): raw units for non-SI columns; converted on load. Known: F, mph, km/h, W
# timestamps (optional): "start" (default) or "end", whether a raw timestamp marks the
#   start or end of the interval it averages over
# utc_files (optional): filename substrings of files logged in UTC; converted to local
#   time (DST-aware). Verify with qa.file_timing() in notebook 01.
# file_offsets_h (optional): {filename substring: hours to add}, for files whose clock is
#   off by a fixed amount. Find the amount with qa.lag_scan(df, by="month").
# ac_capacity_kw (optional): inverter AC limit; inferred from the data if null

sites:
  2107:
    name: Farm Solar Array
    location: Arbuckle, CA
    source: prize
    latitude: 38.996306
    longitude: -122.134111
    elevation_m: 10
    timezone: America/Los_Angeles
    dc_capacity_kw: 893
    mount: fixed
    tilt: 25
    azimuth: 180
    years_available: [2017, 2025]
    # Timing (notebook 01): interval-start stamps align 2017-2023 best. The 2025
    # irradiance file is logged in UTC (7.5 h lag; irradiance ran into the night).
    # irradiance_data_2024 (Jan 2024) is local time but its peak looks ~1.5 h late:
    # pin down the exact offset with the monthly lag scan, then add it below.
    timestamps: start
    utc_files: [irradiance_15m_data_2025]
    file_offsets_h: {}   # e.g. {irradiance_data_2024: -1.5}
    ac_capacity_kw: null # inferred from the clipping ceiling (~705 kW in the scatter)
    columns:
      ac_power: meter_revenue_grade_ac_output_meter_149578   # revenue meter, kW AC
      poa_irradiance: poa_irradiance_o_149574                # W/m², 5-min
      module_temp: null                                      # no module temp sensor at this site
      ambient_temp: ambient_temperature_o_149575
      wind_speed: wind_speed_o_149576
    units:
      ambient_temp: F
      wind_speed: mph

  4902:
    name: NIST Ground Array
    location: Gaithersburg, MD
    source: basic
    latitude: 39.1319
    longitude: -77.2141
    elevation_m: 138
    timezone: America/New_York
    dc_capacity_kw: 270.7
    mount: fixed
    tilt: 20
    azimuth: 180
    years_available: [2014, 2018]
    # PVDAQ metrics table (data/processed/4902/inspect.md). 1-min data.
    columns:
      ac_power: metric_82633        # PwrMtrP_kW_Avg, revenue meter, kW (peaks ~246 kW)
      poa_irradiance: metric_82622  # SEWSPOAIrrad_Wm2_Avg, plane of array, W/m2
      module_temp: metric_82621     # SEWSModuleTemp_C_Avg
      ambient_temp: metric_82620    # SEWSAmbientTemp_C_Avg
      wind_speed: metric_82665      # WindSpeedAve_ms

  4903:
    name: NIST Roof Array
    location: Gaithersburg, MD
    source: basic
    latitude: 39.1354
    longitude: -77.2156
    elevation_m: 149
    timezone: America/New_York
    dc_capacity_kw: 73.7
    mount: fixed
    tilt: 10
    azimuth: 180
    years_available: [2014, 2018]
    # PVDAQ metrics table (data/processed/4903/inspect.md). 1-min data.
    columns:
      ac_power: metric_82754        # PwrMtrP_kW_Avg, revenue meter, kW (peaks ~67 kW)
      poa_irradiance: metric_82743  # SEWSPOAIrrad_Wm2_Avg, plane of array, W/m2
      module_temp: metric_82742     # SEWSModuleTemp_C_Avg
      ambient_temp: metric_82741    # SEWSAmbientTemp_C_Avg
      wind_speed: metric_82777      # WindSpeedAve_ms

  1430:
    name: NREL Mesa 1-axis
    location: Golden, CO
    source: basic
    latitude: 39.7438
    longitude: -105.1779
    elevation_m: 1831
    timezone: America/Denver
    dc_capacity_kw: 720.72
    mount: single_axis
    tilt: 0
    azimuth: 180
    years_available: [2008, 2017]
    # 720 kW DC on two 333 kW inverters (NREL fact sheet FS-6A4-44785). The power channel
    # peaks ~316 kW, i.e. one inverter's half of the array; it's labelled W but reads kW.
    metered_fraction: 0.5
    columns:
      ac_power: metric_5074         # ac_power
      poa_irradiance: metric_5041   # poa_irradiance, W/m2
      module_temp: metric_5043      # module_temp, C
      ambient_temp: metric_5042     # ambient_temp, C
      wind_speed: metric_5044       # wind_speed, m/s

  1367:
    name: City of Henderson Aquatic Complex
    location: Henderson, NV
    source: basic
    latitude: 36.033
    longitude: -114.9516
    elevation_m: 660
    timezone: America/Los_Angeles
    dc_capacity_kw: 277.16
    mount: fixed
    tilt: 12
    azimuth: 172
    years_available: [2013, 2020]
    # Not mapped yet: the POA channel (metric_4195) peaks at ~27 on a June day in Henderson,
    # so its scaling is unknown; temperatures (metric_4193/4194) are in kelvin (unit: K).
    # Power would be metric_3091 (W, sum of three inverters). Stays on demo data until the
    # irradiance can be trusted or replaced with satellite irradiance.
    columns:
      ac_power: null
      poa_irradiance: null
      module_temp: null
      ambient_temp: null
      wind_speed: null
