# Starter fleet for the solar performance monitor.
# Metadata comes from NREL's PVDAQ systems index (systems_20250729.csv).
#
# source:
#   prize -> 2023 DOE Solar Data Prize site (CSV files under pvdaq/2023-solar-data-prize/<id>_OEDI/data/)
#   basic -> standard PVDAQ site (daily files under pvdaq/<fmt>/pvdata/system_id=<id>/year=/month=/day=/)
#
# columns: maps our canonical names to the raw column names in that site's files.
# Leave as null until you've run `python -m solarmon.inspect <id>` and picked the right sensors.
#
# units (optional): raw units for non-SI columns; converted on load. Known: F, mph, km/h, W
# timestamps (optional): "start" (default) or "end", whether a raw timestamp marks the
#   start or end of the interval it averages over
# utc_files (optional): filename substrings of files logged in UTC; converted to local
#   time (DST-aware). Verify with qa.file_timing() in notebook 01.

sites:
  2107:
    name: Farm Solar Array
    location: Arbuckle, CA
    source: prize
    latitude: 38.996306
    longitude: -122.134111
    elevation_m: 10
    timezone: America/Los_Angeles
    dc_capacity_kw: 893
    mount: fixed
    tilt: 25
    azimuth: 180
    years_available: [2017, 2025]
    # Lag scan (notebook 01): interval-start alignment fits 2017-2023 best; the newer
    # per-year irradiance files are logged in UTC (7.5 h lag, irradiance into the night).
    timestamps: start
    utc_files: [irradiance_data_2024, irradiance_15m_data_2025]
    columns:
      ac_power: meter_revenue_grade_ac_output_meter_149578   # revenue meter, kW AC
      poa_irradiance: poa_irradiance_o_149574                # W/m², 5-min
      module_temp: null                                      # no module temp sensor at this site
      ambient_temp: ambient_temperature_o_149575
      wind_speed: wind_speed_o_149576
    units:
      ambient_temp: F
      wind_speed: mph

